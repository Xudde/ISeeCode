<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}源码自动化审计平台{% endblock %}</title>
<script>
/* 主题预加载：优先本地记忆，其次跟随系统，避免渲染后闪烁 */
(function () {
  var t = null;
  try { t = localStorage.getItem('sap-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <div class="name">源码审计平台</div>
        <div class="sub">Source Audit v2.1</div>
      </div>
    </div>
    <nav class="side-nav">
      <a href="/" {% if nav == 'tasks' %}class="active"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg>
        任务列表
      </a>
      <a href="/config" {% if nav == 'config' %}class="active"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        平台设置
      </a>
    </nav>
    <div class="side-foot">
      <button type="button" class="theme-btn" id="theme-btn" title="切换白天 / 夜间主题">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="t-light">切换白天模式</span>
        <span class="t-dark">切换夜间模式</span>
      </button>
      <div><span class="dot"></span>服务运行中</div>
      <div>流水线：semgrep → LLM 研判<br>→ 沙箱 POC → Agent 全量审计</div>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="toasts"></div>

<script>
/* 主题切换 */
document.getElementById('theme-btn').addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('sap-theme', next); } catch (e) {}
});

/* ==================== 公共工具 ==================== */
window.SAP = {
  /* 任务状态元数据：label + tone(run/ok/bad/dim) */
  STATUS: {
    pending:             { label: '排队中',     tone: 'run' },
    preprocessing:       { label: '预处理',     tone: 'run' },
    sast:                { label: '静态扫描',   tone: 'run' },
    llm_judging:         { label: 'LLM 研判',   tone: 'run' },
    sandbox_deploying:   { label: '沙箱部署',   tone: 'run' },
    poc_verifying:       { label: 'POC 验证',   tone: 'run' },
    agent_analyzing:     { label: 'Agent 研判', tone: 'run' },
    agent_full_audit:    { label: '全量审计',   tone: 'run' },
    reporting:           { label: '生成报告',   tone: 'run' },
    completed:           { label: '已完成',     tone: 'ok' },
    failed:              { label: '失败',       tone: 'bad' },
    skipped:             { label: '已跳过',     tone: 'dim' },
    cancelled:           { label: '已停止',     tone: 'dim' }
  },
  FINAL: ['completed', 'failed', 'skipped', 'cancelled'],

  esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  },
  statusPill(st) {
    const m = this.STATUS[st] || { label: st, tone: 'dim' };
    return `<span class="pill pill-${m.tone}">${m.label}</span>`;
  },
  sevBadge(sev) {
    const s = (sev || 'INFO').toUpperCase();
    return `<span class="sev sev-${s.toLowerCase()}">${s}</span>`;
  },
  verdict(v) {
    if (v.agent_status === 'verified') return { cls: 'vb-real', txt: '确认', key: 'real' };
    if (v.agent_status === 'false_positive') return { cls: 'vb-fp', txt: '误报', key: 'fp' };
    if (v.agent_status === 'unverified') return { cls: 'vb-pending', txt: '未验证', key: 'pending' };
    if (v.agent_status === 'error') return { cls: 'vb-err', txt: '分析失败', key: 'pending' };
    if (v.llm_is_real === true) return { cls: 'vb-real', txt: '真实', key: 'real' };
    if (v.llm_is_real === false) return { cls: 'vb-fp', txt: '误报', key: 'fp' };
    return { cls: 'vb-pending', txt: '未研判', key: 'pending' };
  },
  fmtTime(iso) {
    if (!iso) return '-';
    const d = new Date(String(iso).replace(' ', 'T'));
    if (isNaN(d)) return String(iso);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  },
  fmtNum(n) {
    n = Number(n || 0);
    return n >= 1000000 ? (n / 1000000).toFixed(1) + 'M'
         : n >= 10000 ? (n / 1000).toFixed(0) + 'k'
         : String(n);
  },
  async api(path, opts) {
    const resp = await fetch(path, opts);
    if (resp.status === 401) { location.href = '/login'; throw new Error('未登录'); }
    let data = null;
    try { data = await resp.json(); } catch (e) { /* 非 JSON */ }
    if (!resp.ok) throw Object.assign(new Error((data && (data.detail || data.message)) || `HTTP ${resp.status}`), { status: resp.status, data });
    return data;
  },
  toast(msg, type = 'info', ms = 3600) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, ms);
  },
  stackTags(stack) {
    return String(stack || '').split(',').filter(Boolean)
      .map(s => `<span class="stack-tag">${this.esc(s.trim())}</span>`).join('') || '<span class="muted">-</span>';
  }
};
</script>
{% block scripts %}{% endblock %}
</body>
</html>
